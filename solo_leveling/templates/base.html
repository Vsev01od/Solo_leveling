{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Solo Leveling{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

    <style>
        /* ── Reset ─────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ── Variables ─────────────────────────── */
        :root {
            --bg:           #0d0f14;
            --surface:      #13161e;
            --surface-2:    #1a1e2a;
            --border:       #2a2f3f;
            --border-glow:  #3d4a6b;
            --gold:         #c9a84c;
            --gold-light:   #e8cc7a;
            --gold-dim:     #7a6230;
            --text:         #d4cfc8;
            --text-dim:     #6b6b7a;
            --text-muted:   #3a3d4f;
            --danger:       #c0392b;
            --complete:     #2e7d5e;
            --radius:       4px;
            --transition:   0.2s ease;
            --font-display: 'Cinzel', serif;
            --font-body:    'Crimson Pro', serif;
        }

        /* ── Base ──────────────────────────────── */
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            /* subtle noise texture */
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(74,124,255,0.03) 0%, transparent 60%);
        }

        main {
            flex: 1;
        }

        /* ── Header ────────────────────────────── */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 56px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        /* gold line accent under header */
        .site-header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
        }

        .site-header__logo {
            font-family: var(--font-display);
            font-size: .95rem;
            font-weight: 700;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--gold);
            text-decoration: none;
            text-shadow: 0 0 18px rgba(201,168,76,0.3);
        }

        .site-header__nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .site-header__nav a {
            font-family: var(--font-display);
            font-size: .65rem;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--text-dim);
            text-decoration: none;
            transition: color var(--transition);
        }

        .site-header__nav a:hover {
            color: var(--gold);
        }

        .site-header__nav a.active {
            color: var(--gold-light);
        }

        /* ── Footer ────────────────────────────── */
        .site-footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
        }

        .site-footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
        }

        .site-footer__text {
            font-family: var(--font-display);
            font-size: .58rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .site-footer__sep {
            color: var(--gold-dim);
            font-size: .6rem;
        }

        /* ── Scrollbar ─────────────────────────── */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-glow);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-dim);
        }

        /* ── Selection ─────────────────────────── */
        ::selection {
            background: rgba(201, 168, 76, 0.2);
            color: var(--gold-light);
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>

    {% include 'includes/header.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    {% block extra_js %}{% endblock %}
</body>
</html>
