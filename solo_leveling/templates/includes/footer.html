{% now "Y" as server_year %}
{% now "Y-m-d H:i:s" as server_datetime %}

<footer class="bg-light text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">
            © <span id="footer-year">{{ server_year }}</span> Мой тестовый магазин
        </small>
    </div>
</footer>

<script>
    (function () {
        const serverYear = parseInt("{{ server_year }}", 10);
        const clientYear = new Date().getFullYear();
        const serverTime = new Date("{{ server_datetime }}");
        const diffHours = Math.abs(new Date() - serverTime) / 36e5;

        if (diffHours <= 24 && clientYear !== serverYear) {
            document.getElementById("footer-year").textContent = clientYear;
        }
    })();
</script>
