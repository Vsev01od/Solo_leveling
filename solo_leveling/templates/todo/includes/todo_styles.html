<style>
/* =========================================
   QUEST LOG — Todo App Styles
   ========================================= */

/* ── Layout ─────────────────────────────── */
.quest-container {
  max-width: 680px;
  margin: 48px auto;
  padding: 0 20px 80px;
}

.quest-container--wide {
  max-width: 1100px;
}

/* ── Header ─────────────────────────────── */
.quest-header {
  text-align: center;
  margin-bottom: 40px;
  position: relative;
}

.quest-header::before,
.quest-header::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 28%;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold-dim));
}
.quest-header::before { left: 0; }
.quest-header::after  { right: 0; background: linear-gradient(to left, transparent, var(--gold-dim)); }

.quest-header h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.5rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  text-shadow: 0 0 24px rgba(201, 168, 76, 0.35);
  line-height: 1;
}

.quest-header .subtitle {
  font-family: var(--font-body);
  font-style: italic;
  font-size: .95rem;
  color: var(--text-dim);
  margin-top: 6px;
  letter-spacing: .05em;
}

/* ── Board (3 columns) ──────────────────── */
.quest-board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  align-items: start;
}

/* ── Column ─────────────────────────────── */
.quest-column {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Column header bar */
.quest-column__header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}

.quest-column__icon {
  font-size: .75rem;
}

.quest-column__title {
  font-family: var(--font-display);
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  flex: 1;
}

.quest-column__rank {
  font-family: var(--font-display);
  font-size: .58rem;
  letter-spacing: .12em;
  padding: 2px 8px;
  border-radius: 2px;
  border: 1px solid;
}

/* Easy — green */
.quest-column--easy .quest-column__header { border-top: 2px solid #2e7d5e; }
.quest-column--easy .quest-column__icon   { color: #4ade80; }
.quest-column--easy .quest-column__title  { color: #4ade80; }
.quest-column--easy .quest-column__rank   { color: #2e7d5e; border-color: #2e7d5e; }
.quest-column--easy .quest-item           { border-left-color: #2e7d5e; }
.quest-column--easy .quest-item:hover     { border-left-color: #4ade80; }
.quest-column--easy .quest-add-panel      { border-top-color: #2e7d5e; }
.quest-column--easy .quest-add-panel::before { color: #2e7d5e; }
.quest-column--easy .btn-add             { color: #2e7d5e; border-color: #2e7d5e; }
.quest-column--easy .btn-add:hover       { color: #4ade80; border-color: #4ade80; background: rgba(46,125,94,0.1); box-shadow: 0 0 16px rgba(46,125,94,0.15); }

/* Medium — gold */
.quest-column--medium .quest-column__header { border-top: 2px solid var(--gold-dim); }
.quest-column--medium .quest-column__icon   { color: var(--gold); }
.quest-column--medium .quest-column__title  { color: var(--gold); }
.quest-column--medium .quest-column__rank   { color: var(--gold-dim); border-color: var(--gold-dim); }
.quest-column--medium .quest-item           { border-left-color: var(--gold-dim); }
.quest-column--medium .quest-item:hover     { border-left-color: var(--gold); }
.quest-column--medium .quest-add-panel      { border-top-color: var(--gold-dim); }
.quest-column--medium .quest-add-panel::before { color: var(--gold-dim); }
.quest-column--medium .btn-add             { color: var(--gold-dim); border-color: var(--gold-dim); }
.quest-column--medium .btn-add:hover       { color: var(--gold); border-color: var(--gold); background: rgba(201,168,76,0.08); box-shadow: 0 0 16px rgba(201,168,76,0.15); }

/* Hard — red/purple */
.quest-column--hard .quest-column__header { border-top: 2px solid #7c3aed; }
.quest-column--hard .quest-column__icon   { color: #a78bfa; }
.quest-column--hard .quest-column__title  { color: #a78bfa; }
.quest-column--hard .quest-column__rank   { color: #7c3aed; border-color: #7c3aed; }
.quest-column--hard .quest-item           { border-left-color: #7c3aed; }
.quest-column--hard .quest-item:hover     { border-left-color: #a78bfa; }
.quest-column--hard .quest-add-panel      { border-top-color: #7c3aed; }
.quest-column--hard .quest-add-panel::before { color: #7c3aed; }
.quest-column--hard .btn-add             { color: #7c3aed; border-color: #7c3aed; }
.quest-column--hard .btn-add:hover       { color: #a78bfa; border-color: #a78bfa; background: rgba(124,58,237,0.1); box-shadow: 0 0 16px rgba(124,58,237,0.15); }

/* ── Task list ──────────────────────────── */
.quest-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  min-height: 60px;
}

/* ── Task card ──────────────────────────── */
.quest-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold-dim);
  border-radius: var(--radius);
  padding: 10px 12px;
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}

.quest-item:hover {
  background: var(--surface-2);
  box-shadow: 0 0 10px rgba(201, 168, 76, 0.06);
}

/* ── Checkbox ────────────────────────────── */
.quest-checkbox {
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--text-muted);
  border-radius: 2px;
  background: transparent;
  cursor: pointer;
  position: relative;
  transition: all var(--transition);
}

.quest-checkbox:hover {
  border-color: var(--gold-dim);
}

.quest-checkbox:checked {
  background: var(--complete);
  border-color: var(--complete);
}

.quest-checkbox:checked::after {
  content: '✓';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: .65rem;
  color: #fff;
  line-height: 1;
}

/* ── Completed task ──────────────────────── */
.quest-item.completed {
  opacity: .55;
}

.quest-item.completed .quest-text {
  text-decoration: line-through;
  color: var(--text-dim);
}

.quest-text {
  flex: 1;
  font-family: var(--font-body);
  font-size: .98rem;
  color: var(--text);
  letter-spacing: .02em;
  line-height: 1.3;
}

.btn-delete {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  font-size: .6rem;
  font-family: var(--font-display);
  letter-spacing: .08em;
  padding: 4px 8px;
  cursor: pointer;
  transition: all var(--transition);
  text-transform: uppercase;
}

.btn-delete:hover {
  border-color: var(--danger);
  color: var(--danger);
  background: rgba(192, 57, 43, 0.15);
}

/* ── Add panel ──────────────────────────── */
.quest-add-panel {
  background: var(--surface);
  border-top: 2px solid var(--gold-dim);
  padding: 16px;
  position: relative;
  margin-top: auto;
}

.quest-add-panel::before {
  content: '✦ НОВОЕ ЗАДАНИЕ';
  position: absolute;
  top: -10px;
  left: 14px;
  background: var(--surface);
  padding: 0 8px;
  font-family: var(--font-display);
  font-size: .55rem;
  font-weight: 600;
  letter-spacing: .14em;
  color: var(--gold-dim);
}

.quest-add-panel p {
  margin-bottom: 10px;
}

.quest-add-panel label {
  display: block;
  font-family: var(--font-display);
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: .12em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 5px;
}

.quest-add-panel input[type="text"],
.quest-add-panel textarea,
.quest-add-panel select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-family: var(--font-body);
  font-size: .9rem;
  color: var(--text);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.quest-add-panel textarea {
  height: 52px;
  resize: none;
}

.quest-add-panel input[type="text"]:focus,
.quest-add-panel textarea:focus {
  border-color: var(--gold-dim);
  box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.08);
}

.quest-add-panel input[type="text"]::placeholder,
.quest-add-panel textarea::placeholder {
  color: var(--text-muted);
  font-style: italic;
}

.quest-add-panel input[type="checkbox"] {
  accent-color: var(--gold);
  width: 14px;
  height: 14px;
  margin-right: 6px;
  cursor: pointer;
}

.btn-add {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  background: transparent;
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius);
  padding: 8px 16px;
  font-family: var(--font-display);
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold-dim);
  cursor: pointer;
  transition: all var(--transition);
}

.btn-add::before {
  content: '⚔';
  font-size: .7rem;
}

.btn-add:active {
  transform: scale(.97);
}

/* ── Empty state ────────────────────────── */
.quest-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-style: italic;
  font-size: 1rem;
  letter-spacing: .05em;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  margin-top: 20px;
}

/* ── Responsive ─────────────────────────── */
@media (max-width: 768px) {
  .quest-board {
    grid-template-columns: 1fr;
  }
}
</style>
