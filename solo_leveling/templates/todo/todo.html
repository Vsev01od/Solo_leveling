{% extends "base.html" %}

{% block content %}

{% for task in todolist %}

    <p>{{ task.text }}</p>
    <p>{{ task.T_or_F }}</p>
    <form method="POST", action="{% url 'todo:todo_del' task.id %}">
        {% csrf_token %}
        <button type="submit">Убрать задачу</button>
    </form><br>

{% endfor %}


<form method="POST", action="{% url 'todo:todo_add'%}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Добавить задачку</button>
</form>

{% endblock %}
